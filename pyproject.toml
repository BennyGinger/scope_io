[project]
name = "scope-io"
version = "3.0.0"
description = "Microscopy image I/O with explicit axes, channels, and portable artifact metadata."
readme = "README.md"
authors = [
    { name = "Benoit Roux", email = "benoit.roux@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "imagecodecs>=2026.1.14",
    "nd2>=0.11.2",
    "tifffile>=2026.1.14",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pyright>=1.1.414",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"

